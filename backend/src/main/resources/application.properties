spring.application.name=AegisFlow

spring.datasource.url=jdbc:h2:mem:aegisflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

aegisflow.jwt.secret=${AEGISFLOW_JWT_SECRET}
aegisflow.auth.access-token-ttl=PT15M
aegisflow.auth.refresh-token-ttl=PT168H
aegisflow.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
aegisflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
aegisflow.demo-data.enabled=false
aegisflow.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
aegisflow.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:AegisFlow Admin}
aegisflow.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
aegisflow.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
